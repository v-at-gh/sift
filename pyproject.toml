[project]
name = "sift"
version = "0.0.1"
description = "SIFT's Interactive File Trawler: select, transform, and assemble source files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8"]

[project.optional-dependencies]
kotlin = ["tree-sitter-kotlin[core]==1.1.0"]
imports = ["grimp>=3.18,<4"]

[project.scripts]
sift = "sift.cli:main"
sift-restore = "sift.restore_cli:main"
sift-tui = "sift.tui:main"
# sift-deps = "sift.deps_cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
